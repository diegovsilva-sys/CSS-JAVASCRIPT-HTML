<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            PAINEL DIGITAL
        </div>

        <div class="time" id="hora-completa">00:00:00</div>
        <div class="date" id="data-completa">00/00/0000</div>

        <div class="date-boxes">
            <div class="box">
                <span>DIA</span>
                <strong id="box-dia">00</strong>
            </div>
            <div class="box">
                <span>MÊS</span>
                <strong id="box-mes">00</strong>
            </div>
            <div class="box">
                <span>ANO</span>
                <strong id="box-ano">0000</strong>
            </div>
        </div>

        <div class="greeting" id="saudacao">
            ☀️ BOA TARDE!
        </div>

    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
